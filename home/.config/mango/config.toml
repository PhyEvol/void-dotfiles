# ~/.config/mango/config.toml
# Portada desde ~/.config/sway/config (versión minimalista)
# Convertida de config.conf a TOML
# Recarga con SUPER+r
#
# Orden obligatorio en TOML: las opciones globales, [env] y [var] van ANTES
# de las tablas de atajos y reglas (una tabla dura hasta el siguiente encabezado).


[global]

### Inicio ######################################################################

exec_once = [
    "dbus-update-activation-environment --all",
    "pipewire",
    "noctalia",
]


### Pantalla ####################################################################
# Ajusta width/height/refresh a los valores reales (míralos con: wlr-randr)
# La regla de monitor (comentada) está al final del archivo, en [[rule.monitor_rule]]


### Entrada #####################################################################
# Los cambios de entrada requieren reiniciar mango (cerrar sesión y volver a entrar)

xkb_rules_layout = "latam"
#xkb_rules_options = "caps:escape"
repeat_delay = 250
repeat_rate = 40

# Touchpad
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 1
trackpad_click_method = 2
trackpad_scroll_method = 1
trackpad_accel_profile = 2
trackpad_accel_speed = 0.2
trackpad_disable_while_typing = 0
button_map = 0

# Cursor (MeguminCursor)
# (las variables XCURSOR_* están en la tabla [env] de más abajo)
cursor_theme = "MeguminCursor"
cursor_size = 36


### Apariencia ##################################################################

border_px = 2
gap_inner_horizontal = 6
gap_inner_vertical = 6
gap_outer_horizontal = 6
gap_outer_vertical = 6

border_radius = 6
blur = 0
shadows = 0

# Colores: los define noctalia.conf (se carga al final)
# Para uno propio, ponlo DESPUÉS del source:
# border_color = 0x2a2a2aff
# focus_color = 0xd0d0d0ff

# Opcional: atenuar ventanas sin foco
# dim_enable = 1
# dim_focused_color = 0x00000000
# dim_unfocused_color = 0x00000033


### Animaciones: rápidas, fade puro, sin rebote #################################

animations = 0
layer_animations = 0

animation_type_open = "fade"
animation_type_close = "fade"
layer_animation_type_open = "fade"
layer_animation_type_close = "fade"

animation_fade_in = 1
animation_fade_out = 1
fade_in_begin_opacity = 0.0
fade_out_begin_opacity = 0.0

animation_duration_open = 200
animation_duration_close = 150
animation_duration_move = 220
animation_duration_tag = 230
animation_duration_focus = 0

animation_curve_open = [0.2, 0.8, 0.2, 1.0]
animation_curve_move = [0.2, 0.8, 0.2, 1.0]
animation_curve_tag = [0.2, 0.8, 0.2, 1.0]
animation_curve_close = [0.4, 0.0, 1.0, 1.0]
animation_curve_opacity_fade_in = [0.2, 0.8, 0.2, 1.0]
animation_curve_opacity_fade_out = [0.4, 0.0, 1.0, 1.0]

tag_animation_direction = 1


### Tema de noctalia (al final: sus valores pisan a los de arriba) ##############
# noctalia.conf sigue siendo .conf: mango lo lee con el parser que corresponde
# a su extensión, así que se pueden mezclar.

#source = ["~/.config/mango/noctalia.conf"]


[env]
"XCURSOR_THEME" = "MeguminCursor"
"XCURSOR_SIZE" = "36"


### Atajos ######################################################################

[bind.default]

### Atajos básicos ##############################################################

"SUPER+Return" = "spawn,alacritty"
"SUPER+d" = "spawn,noctalia msg panel-toggle launcher"
# "SUPER+d" = "spawn,fuzzel"
"SUPER+q" = "killclient"

"SUPER+r" = "reload_config"
"SUPER+SHIFT+e" = "spawn_shell,bluetoothctl disconnect; pkill wireplumber; pkill pipewire; mmsg dispatch quit"


### Foco y movimiento ###########################################################

"SUPER+h" = "focusdir,left"
"SUPER+j" = "focusdir,down"
"SUPER+k" = "focusdir,up"
"SUPER+l" = "focusdir,right"
"SUPER+Left" = "focusdir,left"
"SUPER+Down" = "focusdir,down"
"SUPER+Up" = "focusdir,up"
"SUPER+Right" = "focusdir,right"
"SUPER+Tab" = "focusstack,next"

"SUPER+SHIFT+h" = "exchange_client,left"
"SUPER+SHIFT+j" = "exchange_client,down"
"SUPER+SHIFT+k" = "exchange_client,up"
"SUPER+SHIFT+l" = "exchange_client,right"
"SUPER+SHIFT+Left" = "exchange_client,left"
"SUPER+SHIFT+Down" = "exchange_client,down"
"SUPER+SHIFT+Up" = "exchange_client,up"
"SUPER+SHIFT+Right" = "exchange_client,right"


### Tags (equivalen a los workspaces de sway, del 1 al 9) #######################

"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"

"SUPER+SHIFT+1" = "tag,1,0"
"SUPER+SHIFT+2" = "tag,2,0"
"SUPER+SHIFT+3" = "tag,3,0"
"SUPER+SHIFT+4" = "tag,4,0"
"SUPER+SHIFT+5" = "tag,5,0"
"SUPER+SHIFT+6" = "tag,6,0"
"SUPER+SHIFT+7" = "tag,7,0"
"SUPER+SHIFT+8" = "tag,8,0"
"SUPER+SHIFT+9" = "tag,9,0"


### Layout ######################################################################

"SUPER+e" = "switch_layout"
"SUPER+f" = "togglefullscreen"
"SUPER+SHIFT+space" = "togglefloating"


### Scratchpad ##################################################################

"SUPER+SHIFT+minus" = "minimized"
"SUPER+minus" = "toggle_scratchpad"

# Terminal desplegable (tecla Copilot): reemplaza a ~/.local/bin/scratch-term
# (la regla de ventana con el tamaño está en [[rule.window_rule]], más abajo)
"SUPER+SHIFT+XF86Assistant" = "toggle_named_scratchpad,scratch,none,alacritty --class scratch"


### Capturas de pantalla (grim + slurp + wl-clipboard + libnotify) ##############
# (strings con comillas simples: son literales, no hace falta escapar nada)

# Pantalla completa -> portapapeles
# "Print" = 'spawn_shell,grim - | wl-copy -t image/png && notify-send "Captura copiada al portapapeles"'
"Print" = 'spawn_shell,grim -l 1 - | wl-copy -t image/png && notify-send "Captura copiada al portapapeles"'

# Área seleccionada -> portapapeles (no hace nada si cancelas con Esc)
"SUPER+SHIFT+s" = 'spawn_shell,area=$(slurp) && [ -n "$area" ] && grim -l 1 -g "$area" - | wl-copy -t image/png && notify-send "Área copiada al portapapeles"'

# Pantalla completa -> archivo
"SHIFT+Print" = 'spawn_shell,mkdir -p ~/Pictures/Capturas && grim ~/Pictures/Capturas/captura_$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Captura guardada en Pictures/Capturas"'


### Redimensionar (sin modo): SUPER+CTRL + flechas o hjkl #######################
# También puedes redimensionar con SUPER + clic derecho (mousebind más abajo)

"SUPER+CTRL+h" = "resizewin,-20,0"
"SUPER+CTRL+j" = "resizewin,0,+20"
"SUPER+CTRL+k" = "resizewin,0,-20"
"SUPER+CTRL+l" = "resizewin,+20,0"
"SUPER+CTRL+Left" = "resizewin,-20,0"
"SUPER+CTRL+Down" = "resizewin,0,+20"
"SUPER+CTRL+Up" = "resizewin,0,-20"
"SUPER+CTRL+Right" = "resizewin,+20,0"

# Si en layouts tileados resizewin no responde, usa el área master en su lugar:
# "SUPER+CTRL+Left" = "setmfact,-0.05"
# "SUPER+CTRL+Right" = "setmfact,+0.05"

"SUPER+SHIFT+p" = "spawn_shell,$HOME/.local/bin/mango-sound"


### Teclas multimedia (bindl -> funcionan con la pantalla bloqueada) ############

[bind.default.lock]

# Volumen (pipewire-pulse)
"XF86AudioMute" = "spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle"
"XF86AudioLowerVolume" = "spawn,pactl set-sink-volume @DEFAULT_SINK@ -2%"
"XF86AudioRaiseVolume" = "spawn,pactl set-sink-volume @DEFAULT_SINK@ +2%"
"XF86AudioMicMute" = "spawn,pactl set-source-mute @DEFAULT_SOURCE@ toggle"

# Alternativa con OSD de noctalia (reemplaza las tres primeras de arriba)
# "XF86AudioRaiseVolume" = "spawn,noctalia msg volume-up"
# "XF86AudioLowerVolume" = "spawn,noctalia msg volume-down"
# "XF86AudioMute" = "spawn,noctalia msg volume-mute"

# Reproductor (playerctl)
#"XF86AudioPlay" = "spawn,playerctl play-pause"
#"XF86AudioPause" = "spawn,playerctl pause"
"XF86AudioPrev" = "spawn,playerctl previous"
"XF86AudioNext" = "spawn,playerctl next"
"XF86AudioStop" = "spawn,playerctl stop"

# Brillo (brightnessctl); --min-value evita apagar el panel por completo
"XF86MonBrightnessDown" = "spawn,brightnessctl --min-value=1 set 1%-"
"XF86MonBrightnessUp" = "spawn,brightnessctl set 1%+"


### Mouse #######################################################################
# Mover con SUPER + clic izquierdo, redimensionar con clic derecho

[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"SUPER+btn_right" = "moveresize,curresize"


# Cambiar de tag con SUPER + rueda del mouse (como en Hyprland)

[axisbind.default]
"SUPER+UP" = "viewtoleft"
"SUPER+DOWN" = "viewtoright"


### Reglas ######################################################################

# Pantalla: ajusta a los valores reales (wlr-randr). En el original "height" estaba vacío.
# [[rule.monitor_rule]]
# name = "STA0010"
# width = 1920
# height = 1080
# refresh = 60
# x = 0
# y = 0
# scale = 1.0

# Layout
[[rule.tag_rule]]
id = 1
layout_name = "tile"

# [[rule.tag_rule]]
# id = 2
# layout_name = "scroller"

# Scratchpad: ajusta el tamaño a gusto (en sway era 80% x 60%)
[[rule.window_rule]]
is_named_scratchpad = 1
width = 800
height = 500
app_id = "scratch"
